<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civ 7 City Planning Companion</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #d4af37; /* Civ Gold */
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            padding-bottom: 50px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .search-filter-container {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: 1px solid var(--accent-color);
        }

        .section-title {
            color: var(--accent-color);
            font-size: 1.2rem;
            margin: 20px 0 10px 0;
            text-transform: uppercase;
            border-left: 3px solid var(--accent-color);
            padding-left: 8px;
        }

        /* District Card Layout for Mobile */
        .district-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .district-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            cursor: pointer;
            user-select: none;
        }

        .district-header::after {
            content: '➔';
            font-size: 0.8rem;
            transition: transform 0.2s;
            color: var(--accent-color);
            flex-shrink: 0;
            margin-left: 8px;
        }

        .district-card.active .district-header::after {
            transform: rotate(90deg);
        }

        .district-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease-out;
        }

        .district-card.active .district-body {
            max-height: 600px;
        }

        .district-body-inner {
            padding: 10px 15px 15px 15px;
            border-top: 1px solid var(--border-color);
        }

        .district-name {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
        }

        .adjacency-box {
            font-size: 0.9rem;
            background-color: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .era-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85rem;
        }

        .era-section {
            background: rgba(0,0,0,0.2);
            padding: 6px;
            border-radius: 4px;
            border-top: 2px solid var(--text-muted);
        }

        .era-section.antiquity { border-top-color: #cd7f32; }
        .era-section.exploration { border-top-color: #708090; }
        .era-section.modern { border-top-color: var(--accent-color); }

        .era-title {
            font-weight: bold;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .building-line {
            margin-bottom: 2px;
        }
        .building-label {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .cards-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .cards-controls button {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .cards-controls button:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Town Management Tables */
        .mgmt-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            margin: 8px 0;
        }
        .mgmt-table th {
            text-align: left;
            color: var(--accent-color);
            font-size: 0.74rem;
            text-transform: uppercase;
            padding: 4px 6px;
            border-bottom: 1px solid var(--border-color);
        }
        .mgmt-table td {
            padding: 6px 6px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: top;
            line-height: 1.45;
        }
        .tag-good { color: #6abf6a; }
        .tag-bad  { color: #e06060; }
        .focus-badge {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .focus-farming { background: rgba(100,180,80,0.15); color: #7ac060; border: 1px solid #7ac060; }
        .focus-mining  { background: rgba(180,130,60,0.15); color: #c09050; border: 1px solid #c09050; }
        .focus-urban   { background: rgba(100,150,220,0.15); color: #7090d0; border: 1px solid #7090d0; }
        .focus-growing { background: rgba(212,175,55,0.15); color: var(--accent-color); border: 1px solid var(--accent-color); }

        /* Accordion for Tips */
        .tip-accordion {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .tip-header {
            padding: 12px;
            background-color: rgba(255,255,255,0.02);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tip-header::after {
            content: '➔';
            font-size: 0.8rem;
            transition: transform 0.2s;
            color: var(--accent-color);
        }

        .tip-accordion.active .tip-header::after {
            transform: rotate(90deg);
        }

        .tip-content {
            padding: 0 12px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.2s ease-out, padding 0.2s ease-out;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #ccc;
            background-color: rgba(0,0,0,0.1);
        }

        .tip-accordion.active .tip-content {
            padding: 12px;
            max-height: 300px;
        }

        .tip-accordion.active .tip-content.tip-content-tall {
            max-height: 800px;
        }

        /* District yield icon badges */
        .icon-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 0.95rem;
            flex-shrink: 0;
            margin-right: 10px;
        }
        .icon-food       { background: rgba(76,175,80,0.2);   box-shadow: 0 0 0 1px rgba(76,175,80,0.4); }
        .icon-gold       { background: rgba(255,215,0,0.2);   box-shadow: 0 0 0 1px rgba(255,215,0,0.4); }
        .icon-happiness  { background: rgba(255,152,0,0.2);   box-shadow: 0 0 0 1px rgba(255,152,0,0.4); }
        .icon-culture    { background: rgba(186,85,211,0.2);  box-shadow: 0 0 0 1px rgba(186,85,211,0.4); }
        .icon-military   { background: rgba(244,67,54,0.2);   box-shadow: 0 0 0 1px rgba(244,67,54,0.4); }
        .icon-science    { background: rgba(33,150,243,0.2);  box-shadow: 0 0 0 1px rgba(33,150,243,0.4); }
        .icon-coastal    { background: rgba(0,188,212,0.2);   box-shadow: 0 0 0 1px rgba(0,188,212,0.4); }
        .icon-warehouse  { background: rgba(160,120,80,0.2);  box-shadow: 0 0 0 1px rgba(160,120,80,0.4); }
        .icon-influence  { background: rgba(0,200,160,0.2);   box-shadow: 0 0 0 1px rgba(0,200,160,0.4); }
        .icon-palace     { background: rgba(212,175,55,0.2);  box-shadow: 0 0 0 1px rgba(212,175,55,0.5); }
        .icon-special    { background: rgba(150,150,150,0.15);box-shadow: 0 0 0 1px rgba(150,150,150,0.3); }
    </style>
</head>

                        <td class="tag-bad">Hemmed in by other borders, little room to expand</td>
                    </tr>
                    <tr>
                        <td><strong>Food Role</strong></td>
                        <td class="tag-good">Other towns can cover nearby cities' food</td>
                        <td class="tag-bad">Sole food provider to a city — upgrading kills that transfer</td>
                    </tr>
                    <tr>
                        <td><strong>Economy</strong></td>
                        <td class="tag-good">Gold stays positive; still have 1+ supporting towns per city</td>
                        <td class="tag-bad">Would drop below 1:1 city-to-town ratio</td>
                    </tr>
                </table>`
            },
            {
                title: "Picking the Best Upgrade Candidate",
                html: `<p style="margin-bottom:10px;color:var(--text-muted);font-size:0.85rem;">When you can only afford one upgrade, rank your towns on these priorities:</p>
                <table class="mgmt-table">
                    <tr><th>#</th><th>What to Check</th></tr>
                    <tr>
                        <td><strong>1. Adjacency Potential</strong></td>
                        <td>Most important. Towns near mountains, rivers, coasts, and natural wonders will produce far stronger districts as cities. 3+ high-adjacency tiles = top candidate.</td>
                    </tr>
                    <tr>
                        <td><strong>2. Production Base</strong></td>
                        <td>Cities need production to build. Several mines and quarries already worked = hits the ground running. All-farm towns are better left feeding your empire.</td>
                    </tr>
                    <tr>
                        <td><strong>3. Population (Cost)</strong></td>
                        <td>Among equally strong candidates, pick the larger one — same quality at lower cost. 7+ pop can save 300–500 gold over a 2–3 pop town.</td>
                    </tr>
                    <tr>
                        <td><strong>4. Strategic Position</strong></td>
                        <td>Coastal, a choke point, or near a planned wonder location = long-term value. Isolated inland towns without special terrain are weaker candidates.</td>
                    </tr>
                    <tr>
                        <td><strong>5. Victory Goal</strong></td>
                        <td>Science/Culture: prioritize mountain or river adjacency. Domination: coastal and production-heavy. Economy: river/coast for gold adjacency buildings.</td>
                    </tr>
                </table>`
            },
            {
                title: "Food Transfer: Connection Rules",
                html: `<p style="margin-bottom:10px;color:var(--text-muted);font-size:0.85rem;">A specialized town only sends food to cities it is <strong>directly connected</strong> to. The connection type determines how far apart settlements can be.</p>
                <table class="mgmt-table">
                    <tr><th>Connection Type</th><th>How It Works</th></tr>
                    <tr>
                        <td><strong>Auto (≤ ~10 tiles)</strong></td>
                        <td>Settlements within ~10 tiles connect automatically — no road needed.</td>
                    </tr>
                    <tr>
                        <td><strong>Road</strong></td>
                        <td>Build a <em>direct</em> road for distant settlements. The road cannot pass through another settlement — chaining A→B→C does not transfer food from A to C.</td>
                    </tr>
                    <tr>
                        <td><strong>Coast / Navigable River</strong></td>
                        <td>Both settlements touching the same coast or navigable river auto-connect at any distance.</td>
                    </tr>
                    <tr>
                        <td><strong>Second City (Merchant)</strong></td>
                        <td>A Merchant can build a road from a town to a second city, splitting food between both. The second city must be within range with no other city between them.</td>
                    </tr>
                    <tr>
                        <td><strong>Fishing Quay Note</strong></td>
                        <td>For naval routes, the Fishing Quay buildings are the connection point — not the City Halls. Both Quays must be within range of each other.</td>
                    </tr>
                </table>`
            },
            {
                title: "City-to-Town Ratio by Era",
                html: `<table class="mgmt-table">
                    <tr><th>Era</th><th>Target Ratio</th><th>Strategy</th></tr>
                    <tr>
                        <td style="color:#cd7f32;font-weight:bold;">Antiquity</td>
                        <td>More towns than cities<br><span style="font-size:0.75rem;color:var(--text-muted);">~1–2 cities, 4–6 towns</span></td>
                        <td>Settle aggressively. Keep gold high. Keep most towns on Growing Town to claim territory. Upgrade only your 1–2 best adjacency candidates. Upgrading a town here makes it cheaper next age.</td>
                    </tr>
                    <tr>
                        <td style="color:#a0aab0;font-weight:bold;">Exploration</td>
                        <td>Work toward 1:1<br><span style="font-size:0.75rem;color:var(--text-muted);">~3–4 cities, 4–5 towns</span></td>
                        <td>Science and culture matter now. Too few cities entering Modern = falling behind on yields. Convert your strongest candidates. Specialize remaining towns as Farming or Mining once they've claimed their key tiles.</td>
                    </tr>
                    <tr>
                        <td style="color:var(--accent-color);font-weight:bold;">Modern</td>
                        <td>1:1 or 2:1 (tall)<br><span style="font-size:0.75rem;color:var(--text-muted);">~5–6 cities, 4–6 towns</span></td>
                        <td>Specialists and wonders decide victory. Farming Towns provide 100–150 food/turn to fuel specialist growth. Do not convert all towns — you need them feeding your cities. Buy warehouse buildings in towns to spend surplus gold.</td>
                    </tr>
                </table>
                <p style="margin-top:8px;font-size:0.8rem;color:var(--text-muted);">At any age transition: upgrade just before the transition ends to carry the city into the next age and get a head start on building there.</p>`
            }
        ];

        // Generate Town Management Accordions
        function displayTownMgmt() {
            const container = document.getElementById('townMgmtContainer');
            townMgmtData.forEach(item => {
                const acc = document.createElement('div');
                acc.className = 'tip-accordion';
                acc.innerHTML = `
                    <div class="tip-header" onclick="toggleAccordion(this)">${item.title}</div>
                    <div class="tip-content tip-content-tall">${item.html}</div>
                `;
                container.appendChild(acc);
            });
        }

        // Generate Tips Accordion
        function displayTips() {
            const container = document.getElementById('tipsContainer');
            tipsData.forEach(t => {
                const acc = document.createElement('div');
                acc.className = 'tip-accordion';
                acc.innerHTML = `
                    <div class="tip-header" onclick="toggleAccordion(this)">${t.title}</div>
                    <div class="tip-content">${t.text}</div>
                `;
                container.appendChild(acc);
            });
        }

        function toggleAccordion(element) {
            const parent = element.parentElement;
            parent.classList.toggle('active');
        }

        function toggleCard(element) {
            element.parentElement.classList.toggle('active');
        }

        function expandAllCards() {
            document.querySelectorAll('.district-card').forEach(c => c.classList.add('active'));
        }

        function collapseAllCards() {
            document.querySelectorAll('.district-card').forEach(c => c.classList.remove('active'));
        }

        // Live Search Filter
        function filterDistricts() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const filtered = districtsData.filter(d => {
                return d.name.toLowerCase().includes(query) ||
                       d.positioning.toLowerCase().includes(query) ||
                       JSON.stringify(d.antiquity).toLowerCase().includes(query) ||
                       JSON.stringify(d.exploration).toLowerCase().includes(query) ||
                       JSON.stringify(d.modern).toLowerCase().includes(query);
            });
            displayDistricts(filtered);
            if (query) {
                document.querySelectorAll('.district-card').forEach(c => c.classList.add('active'));
            }
        }

        // Initial Load
        displayDistricts(districtsData);
        displayTips();
        displayTownMgmt();
    </script>
</body>
</html>
