<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civ 7 City Planning Companion</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #d4af37; /* Civ Gold */
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            padding-bottom: 50px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .search-filter-container {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: 1px solid var(--accent-color);
        }

        .section-title {
            color: var(--accent-color);
            font-size: 1.2rem;
            margin: 20px 0 10px 0;
            text-transform: uppercase;
            border-left: 3px solid var(--accent-color);
            padding-left: 8px;
        }

        /* District Card Layout for Mobile */
        .district-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .district-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            cursor: pointer;
            user-select: none;
        }

        .district-header::after {
            content: '➔';
            font-size: 0.8rem;
            transition: transform 0.2s;
            color: var(--accent-color);
            flex-shrink: 0;
            margin-left: 8px;
        }

        .district-card.active .district-header::after {
            transform: rotate(90deg);
        }

        .district-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease-out;
        }

        .district-card.active .district-body {
            max-height: 600px;
        }

        .district-body-inner {
            padding: 10px 15px 15px 15px;
            border-top: 1px solid var(--border-color);
        }

        .district-name {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
        }

        .adjacency-box {
            font-size: 0.9rem;
            background-color: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .era-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85rem;
        }

        .era-section {
            background: rgba(0,0,0,0.2);
            padding: 6px;
            border-radius: 4px;
            border-top: 2px solid var(--text-muted);
        }

        .era-section.antiquity { border-top-color: #cd7f32; }
        .era-section.exploration { border-top-color: #708090; }
        .era-section.modern { border-top-color: var(--accent-color); }

        .era-title {
            font-weight: bold;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .building-line {
            margin-bottom: 2px;
        }
        .building-label {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .cards-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .cards-controls button {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .cards-controls button:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Town Management Tables */
        .mgmt-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            margin: 8px 0;
        }
        .mgmt-table th {
            text-align: left;
            color: var(--accent-color);
            font-size: 0.74rem;
            text-transform: uppercase;
            padding: 4px 6px;
            border-bottom: 1px solid var(--border-color);
        }
        .mgmt-table td {
            padding: 6px 6px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: top;
            line-height: 1.45;
        }
        .tag-good { color: #6abf6a; }
        .tag-bad  { color: #e06060; }
        .focus-badge {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .focus-farming { background: rgba(100,180,80,0.15); color: #7ac060; border: 1px solid #7ac060; }
        .focus-mining  { background: rgba(180,130,60,0.15); color: #c09050; border: 1px solid #c09050; }
        .focus-urban   { background: rgba(100,150,220,0.15); color: #7090d0; border: 1px solid #7090d0; }
        .focus-growing { background: rgba(212,175,55,0.15); color: var(--accent-color); border: 1px solid var(--accent-color); }

        /* Accordion for Tips */
        .tip-accordion {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
            display: grid;
            grid-template-rows: auto 0fr;
            transition: grid-template-rows 0.3s ease;
        }

        .tip-accordion.active {
            grid-template-rows: auto 1fr;
        }

        .tip-header {
            padding: 12px;
            background-color: rgba(255,255,255,0.02);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tip-header::after {
            content: '➔';
            font-size: 0.8rem;
            transition: transform 0.2s;
            color: var(--accent-color);
        }

        .tip-accordion.active .tip-header::after {
            transform: rotate(90deg);
        }

        .tip-content {
            overflow: hidden;
            min-height: 0;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #ccc;
            background-color: rgba(0,0,0,0.1);
        }

        .tip-accordion.active .tip-content {
            padding: 12px;
        }

        /* Sub-accordion inside district cards */
        .sub-accordion {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }
        .sub-accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 12px;
            background: rgba(212,175,55,0.06);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent-color);
            user-select: none;
        }
        .sub-accordion-header::after {
            content: '➔';
            font-size: 0.75rem;
            transition: transform 0.2s;
            color: var(--accent-color);
            flex-shrink: 0;
            margin-left: 8px;
        }
        .sub-accordion.active .sub-accordion-header::after {
            transform: rotate(90deg);
        }
        .sub-accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out;
        }
        .sub-accordion.active .sub-accordion-content {
            max-height: 2200px;
        }
        .sub-accordion-inner {
            padding: 2px 10px 10px;
        }
        .ub-era-label {
            font-size: 0.78rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 10px 0 4px;
            border-top: 1px solid var(--border-color);
            margin-top: 4px;
        }
        .ub-era-label:first-of-type { border-top: none; padding-top: 6px; }

        /* Palace card needs taller body to fit sub-accordion */
        .district-card.has-sub.active .district-body { max-height: 2400px; }

        /* District yield icon badges */
        .icon-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 0.95rem;
            flex-shrink: 0;
            margin-right: 10px;
        }
        .icon-food       { background: rgba(76,175,80,0.2);   box-shadow: 0 0 0 1px rgba(76,175,80,0.4); }
        .icon-gold       { background: rgba(255,215,0,0.2);   box-shadow: 0 0 0 1px rgba(255,215,0,0.4); }
        .icon-happiness  { background: rgba(255,152,0,0.2);   box-shadow: 0 0 0 1px rgba(255,152,0,0.4); }
        .icon-culture    { background: rgba(186,85,211,0.2);  box-shadow: 0 0 0 1px rgba(186,85,211,0.4); }
        .icon-military   { background: rgba(244,67,54,0.2);   box-shadow: 0 0 0 1px rgba(244,67,54,0.4); }
        .icon-science    { background: rgba(33,150,243,0.2);  box-shadow: 0 0 0 1px rgba(33,150,243,0.4); }
        .icon-coastal    { background: rgba(0,188,212,0.2);   box-shadow: 0 0 0 1px rgba(0,188,212,0.4); }
        .icon-warehouse  { background: rgba(160,120,80,0.2);  box-shadow: 0 0 0 1px rgba(160,120,80,0.4); }
        .icon-influence  { background: rgba(0,200,160,0.2);   box-shadow: 0 0 0 1px rgba(0,200,160,0.4); }
        .icon-palace     { background: rgba(212,175,55,0.2);  box-shadow: 0 0 0 1px rgba(212,175,55,0.5); }
        .icon-special    { background: rgba(150,150,150,0.15);box-shadow: 0 0 0 1px rgba(150,150,150,0.3); }

        /* Hamburger navigation */
        header { text-align: left; }
        .header-inner {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-text { flex: 1; text-align: center; }
        .nav-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1.7rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            flex-shrink: 0;
        }
        .side-nav {
            position: fixed;
            top: 0;
            left: -270px;
            width: 260px;
            height: 100%;
            background: #181818;
            border-right: 1px solid var(--border-color);
            z-index: 1000;
            transition: left 0.25s ease;
            overflow-y: auto;
            padding-bottom: 40px;
        }
        .side-nav.open { left: 0; }
        .side-nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--accent-color);
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .side-nav-header button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
            line-height: 1;
        }
        .side-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            color: var(--text-color);
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.92rem;
        }
        .side-nav a:hover { color: var(--accent-color); background: rgba(212,175,55,0.05); }
        .nav-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 999;
        }
        .nav-overlay.open { display: block; }

        /* Version badge */
        .version-badge {
            position: fixed;
            bottom: 8px;
            right: 10px;
            background: rgba(0,0,0,0.55);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.6rem;
            padding: 2px 7px;
            border-radius: 10px;
            z-index: 500;
            font-family: monospace;
            pointer-events: none;
            letter-spacing: 0.3px;
        }
    </style>
</head>

        function toggleAccordion(element) {
            element.parentElement.classList.toggle('active');
        }

        function toggleSubAccordion(el) {
            const accordion = el.parentElement;
            const content = accordion.querySelector('.sub-accordion-content');
            const districtBody = accordion.closest('.district-body');

            if (accordion.classList.contains('active')) {
                content.style.maxHeight = '0';
                accordion.classList.remove('active');
            } else {
                accordion.classList.add('active');
                const contentHeight = content.scrollHeight;
                content.style.maxHeight = contentHeight + 'px';
                if (districtBody) {
                    districtBody.style.maxHeight = (districtBody.scrollHeight + contentHeight) + 'px';
                }
            }
        }

        function toggleCard(element) {
            element.parentElement.classList.toggle('active');
        }

        function expandAllCards() {
            document.querySelectorAll('.district-card').forEach(c => c.classList.add('active'));
        }

        function collapseAllCards() {
            document.querySelectorAll('.district-card').forEach(c => c.classList.remove('active'));
        }

        // Live Search Filter
        function filterDistricts() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const filtered = districtsData.filter(d => {
                return d.name.toLowerCase().includes(query) ||
                       d.positioning.toLowerCase().includes(query) ||
                       JSON.stringify(d.antiquity).toLowerCase().includes(query) ||
                       JSON.stringify(d.exploration).toLowerCase().includes(query) ||
                       JSON.stringify(d.modern).toLowerCase().includes(query);
            });
            displayDistricts(filtered);
            if (query) {
                document.querySelectorAll('.district-card').forEach(c => c.classList.add('active'));
            }
        }
